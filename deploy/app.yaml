name: forge-orchestrator
compute: serverless
command:
  - uvicorn
  - anvil.orchestrator.app:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
health_check:
  path: /health
  interval_seconds: 30
  timeout_seconds: 5
env:
  - name: OMNIGENT_SERVER_URL
    value: ${var.omnigent_server_url}
  - name: OMNIGENT_AUTH_TOKEN
    value: ${var.omnigent_auth_token}
  - name: DATABRICKS_WORKSPACE_ID
    value: ${var.databricks_workspace_id}
  - name: GIT_REMOTE_URL
    value: ${var.git_remote_url}
  - name: GIT_TOKEN
    value: ${var.git_token}
  - name: ANVIL_AI_GATEWAY_URL
    value: ${var.ai_gateway_url}
  - name: ANVIL_EVAL_ENGINE
    value: ${var.eval_engine}
  - name: MLFLOW_EXPERIMENT_NAME
    value: ${var.mlflow_experiment}
  - name: ANVIL_OPTIMIZER_MODEL
    value: ${var.optimizer_model}
  - name: ANVIL_DOMAIN_CONFIG
    value: ${var.domain_config}
  - name: ANVIL_OPTIMIZER_BACKEND
    value: omnigent
  # Belt-and-suspenders with the code-level ``os.environ.setdefault`` in
  # ``anvil/__init__.py`` and the app/eval entrypoints: force synchronous
  # MLflow trace export so ``mlflow.genai.evaluate`` cannot crash on a None
  # per-row trace at link time (MLflow 3.11 async-trace issue). ``app.yaml`` is
  # the descriptor the Databricks Apps runtime reads, so the flag must be here
  # too for the deployed app to be mitigated at the env level.
  - name: MLFLOW_ENABLE_ASYNC_TRACE_LOGGING
    value: "false"
