[project]
name = "anvil"
version = "0.2.0"
description = "ANVIL — self-mutating agent harness on Databricks. Runtime + Eval + Optimizer + Loop, 5 planes physically separated."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sdk>=0.40.0",
    "databricks-agents>=0.16.0",
    "mlflow[databricks]>=3.11.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]
# Streamlit dashboard for round exploration. Kept separate from `dev`
# so test runs stay light.
dashboard = [
    "streamlit>=1.39.0",
    "plotly>=5.0",
    "altair>=5.0",
    "pandas>=2.0",
    "tabulate>=0.9",
]
# Optimizer extras — kept out of the runtime install so the deployed
# App container stays minimal.
optimizer = [
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40",
]
# Orchestrator extras — the FastAPI control-plane app served by the
# Databricks App (deploy/app.yaml). Kept out of the base install so
# non-App deployments (CLI-only loop runs) stay light.
orchestrator = [
    "anvil[optimizer]",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"
