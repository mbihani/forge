tools:
- name: search_knowledge_base
  description: 'Search the knowledge base by natural-language query.

    Returns the top-k matching documents, each with doc_id, title,

    and a snippet of the body. Use whenever the user asks about the

    platform — features, pricing, API, integrations, rate limits,

    service tiers, data regions, account setup, SLAs, or support

    plans. If the result is "No matching policy documents." the

    question is out of scope for this knowledge base and you should

    say so.

    '
