# Pitcrew FINRA summarizer scaffold. Skills compose the summarization system
# prompt (verbatim from production's _V1_PROMPT, split by concern). In code
# mode the optimizer rewrites agents/pitcrew_agent.py, which receives this
# composed prompt as ``self.composed_prompt``.
sampling:
  temperature: 0.0
  top_p: null
  max_tokens: 32000
  tool_choice: auto
  max_tool_calls: 0
skills:
- file: identity.md
- file: hierarchy.md
- file: section_summary.md
- file: citations.md
- file: exclusions.md
- file: output_schema.md
rules:
- file: no_repeat_failed_mutations.md
